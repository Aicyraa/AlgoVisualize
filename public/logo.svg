<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161a22"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="100" y1="80" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#6c8fff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6c8fff"/>
      <stop offset="100%" stop-color="#4f6fdf"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="510" height="510" rx="95" fill="none" stroke="url(#accent-grad)" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Subtle grid dots -->
  <g opacity="0.08">
    <circle cx="128" cy="128" r="2" fill="#6c8fff"/>
    <circle cx="192" cy="128" r="2" fill="#6c8fff"/>
    <circle cx="256" cy="128" r="2" fill="#6c8fff"/>
    <circle cx="320" cy="128" r="2" fill="#6c8fff"/>
    <circle cx="384" cy="128" r="2" fill="#6c8fff"/>
    <circle cx="128" cy="192" r="2" fill="#6c8fff"/>
    <circle cx="384" cy="192" r="2" fill="#6c8fff"/>
    <circle cx="128" cy="384" r="2" fill="#6c8fff"/>
    <circle cx="384" cy="384" r="2" fill="#6c8fff"/>
  </g>

  <!-- Visualization bars — ascending pattern like a sorted array -->
  <g filter="url(#glow)">
    <!-- Bar 1 (shortest) -->
    <rect x="108" y="312" width="44" height="80" rx="8" fill="url(#bar5)" opacity="0.9"/>
    <!-- Bar 2 -->
    <rect x="170" y="262" width="44" height="130" rx="8" fill="url(#bar1)" opacity="0.9"/>
    <!-- Bar 3 (center, tallest accent) -->
    <rect x="232" y="182" width="48" height="210" rx="8" fill="url(#bar2)" opacity="1"/>
    <!-- Bar 4 -->
    <rect x="298" y="222" width="44" height="170" rx="8" fill="url(#bar3)" opacity="0.9"/>
    <!-- Bar 5 -->
    <rect x="360" y="272" width="44" height="120" rx="8" fill="url(#bar4)" opacity="0.9"/>
  </g>

  <!-- Connecting flow line (algorithm path) -->
  <path d="M130 304 L192 254 L256 174 L320 214 L382 264"
        stroke="url(#accent-grad)" stroke-width="2.5" stroke-linecap="round"
        stroke-linejoin="round" fill="none" opacity="0.5" stroke-dasharray="6 4"/>

  <!-- Node dots on the flow line -->
  <g filter="url(#soft-glow)">
    <circle cx="130" cy="304" r="5" fill="#ec4899" opacity="0.8"/>
    <circle cx="192" cy="254" r="5" fill="#a78bfa" opacity="0.8"/>
    <circle cx="256" cy="174" r="6" fill="#6c8fff"/>
    <circle cx="320" cy="214" r="5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="382" cy="264" r="5" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- "I" letter mark at top -->
  <text x="256" y="130" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', monospace"
        font-size="72" font-weight="800" fill="url(#accent-grad)" letter-spacing="-2">
    I
  </text>

  <!-- Bottom baseline -->
  <line x1="100" y1="400" x2="412" y2="400" stroke="#252c3a" stroke-width="2" stroke-linecap="round"/>
</svg>
