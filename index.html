<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>AlgoVisual</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="style.css" />
      <script src="script.js" type="module" defer></script>
      <style>
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Jetbrains Mono", sans-serif, monospace;
         }

         html,
         body {
            background: var(--muted-light);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1rem;
         }
      </style>
   </head>
   <body>
      <!-- Selection -->
      <div class="container">
         <div class="dropdown-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
               <path d="M7 10l5 5 5-5z" />
            </svg>
         </div>
         <div class="container-dropdown">
            <div class="sectionA">
               <span class="section-title">Algorithm</span>
               <span class="types selected" data-type="bubble">Bubble </span>
               <span class="types " data-type="selection">Selection </span>
               <span class="types " data-type="insertion">Insertion </span>
               <span class="types " data-type="merge">Merge </span>
               <span class="types " data-type="quick">Quick </span>
            </div>
            <div class="sectionB">
               <span class="section-title">Sorting Speed</span>
               <span class="speed selected" data-speed="1">0.5x</span>
               <span class="speed" data-speed="2">0.75x</span>
               <span class="speed" data-speed="3">1x</span>
               <span class="speed" data-speed="4">1.25x</span>
               <span class="speed" data-speed="5">2.00x</span>
            </div>
         </div>

         <!-- Graph -->
         <div class="container-graph">
            <div class="graph"></div>
         </div>

         <!-- Details -->
         <div class="container-details">
            <h1 id="details-topic"></h1>
            <p id="details-desc"></p>
            <div class="details-status">
               <div class="statusGA">
                  <h4 class="status">Swap Count</h4>
                  <span id="swap-count"> </span>
               </div>
               <div class="statusGB">
                  <span class="status" id="status-log">Status</span>
                  <span id="status-value"></span>
               </div>
            </div>
            <div class="details-input">
               <div class="group input-custom  active">
                   <span class="input-label active">Custom Points</span>
                   <input type="text" id="custom-value" placeholder="e.g., 5, 3, 8, 1, 9, 2" />
                   <button type="button" id="custom-start">Generate</button>
               </div>
               <div class="group input-random">
                   <span class="input-label">Random Points</span>
                   <input type="number" id="random-value" placeholder="Enter number of elements " /> 
                   <button type="button" id="custom-random">Generate</button>
               </div>

               <div class="input-btn">
                   <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                       <path d="M7 10l5 5 5-5z" />
                   </svg>
               </div>
           </div>
         </div>
      </div>
   </body>
   <script>
         const inputBtn = document.querySelector('.input-btn');
        const customGroup = document.querySelector('.input-custom');
        const randomGroup = document.querySelector('.input-random');
        
        let isCustomActive = true;

        inputBtn.addEventListener('click', () => {
            // Toggle the active state
            isCustomActive = !isCustomActive;
            
            // Toggle rotation of arrow
            inputBtn.classList.toggle('rotated');
            
            // Toggle visibility of groups
            if (isCustomActive) {
                customGroup.classList.add('active');
                randomGroup.classList.remove('active');
            } else {
                customGroup.classList.remove('active');
                randomGroup.classList.add('active');
            }
        });
   </script>
</html>
